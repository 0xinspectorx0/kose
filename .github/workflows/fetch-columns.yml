name: Köşe Yazılarını Güncelle (Günlük)

# GEÇİCİ: çalışma dalına push edildiğinde de çalışır (sandbox'tan tetiklemek
# için; schedule yalnızca varsayılan dalda çalışır). İş bitince main'deki
# özgün hâline döndürülecek.
on:
  schedule:
    - cron: '0 4 * * *' # her gün 04:00 UTC = 07:00 TSİ
  workflow_dispatch:
  push:
    branches:
      - 'arena/d1241d9e-kose'

permissions:
  contents: write

jobs:
  fetch-columns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4

      - name: Köşe yazılarını çek
        run: python scripts/fetch_columns.py

      - name: Sonuçları commit'le
        run: |
          git config user.name "kose-bot"
          git config user.email "kose-bot@users.noreply.github.com"
          git add data/daily.json data/writers.json || true
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore: günlük köşe yazıları güncellendi ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          fi
