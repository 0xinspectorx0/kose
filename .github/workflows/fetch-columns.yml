name: Köşe Yazılarını Güncelle (Günlük)

# Türk gazetelerinin köşe yazarı sayfalarından yazıları çeker ve
# data/daily.json + data/writers.json olarak main'e commit'ler.
# Uygulama bu iki dosyayı önce main'den canlı okur.
#
# Neden yarım saatte bir yoklama (sabit slotlar yerine)?
#   GitHub `schedule` tetikleyicisi "en iyi çaba"dır ve bu depoda koşular
#   planlanan saatten 3-6 SAAT SONRA başlıyor. 13-15 Ekim 2026 gözlemi:
#     04:00 UTC slotu -> 09:17'de, 08:30 slotu -> 13:55'te, 14:00 slotu ->
#     18:15'te başladı; 13 Ekim 14:00 koşusu 20:00'de oluşup ertesi sabah
#     05:28'e kadar kuyrukta bekledi; 15 Ekim sabahı hiç koşu düşmedi.
#   Yani "06:13 TSİ sabah çekimi" fiilen öğleden sonraya kayıyor, sabah
#   köşeleri öğlene kadar gelmiyordu. Sabit slot sayısını artırmak bunu
#   çözmez; çözüm sık ve UCUZ yoklama:
#     1. `kontrol` işi (~10 sn, bağımlılık yok) scripts/freshness.py ile
#        "çekim gerekli mi?" kararını verir.
#     2. Asıl `fetch-columns` işi (≈8 dk) YALNIZCA veri bayatsa başlar.
#   Gecikme ne olursa olsun gün boyu düzenli yoklama düşer; gazetelere giden
#   istek sayısı ise politikayla sınırlı kalır (TSİ):
#     - veri bugünün değilse                 -> çek
#     - 05:00-12:00 (yayın penceresi)        -> 1 saatten eskiyse çek
#     - diğer saatlerde                      -> 3 saatten eskiyse çek
#     - seyrekse (< 80 yazı)                 -> saatte bir yeniden çek
#   Dakikalar kasıtlı olarak :00/:30 değil — tam/yarım saatte başlayan
#   koşular GitHub genelinde daha çok gecikiyor.
#
# Diğer tetikleyiciler:
#   - push (main): kazıyıcı/workflow değişikliği merge edilince hemen ZORLA
#     çekim — yeni kod beklemeden devreye girer. (Botun kendi veri commit'leri
#     GITHUB_TOKEN ile atıldığı için yeni koşu tetiklemez; döngü olmaz.)
#   - workflow_dispatch: Actions -> bu workflow -> Run workflow ("force").
#   - verify-columns.yml (watchdog) bayat veride bunu force=true ile tetikler.
#
# Not: `schedule` yalnızca varsayılan dalda (main) çalışır.

on:
  schedule:
    - cron: '7,37 * * * *'   # yarım saatte bir yoklama (karar: scripts/freshness.py)
  push:
    branches: [main, arena/3d2f061e-kose]   # GEÇİCİ: dal üzerinde uçtan uca doğrulama (2: taze veride atlama)
    paths:
      - 'scripts/fetch_columns.py'
      - 'scripts/freshness.py'
      - '.github/workflows/fetch-columns.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Tazelik kısayolunu atla, veriyi zorla yenile'
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  kontrol:
    name: Tazelik kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.karar.outputs.needed }}
      force: ${{ steps.karar.outputs.force }}
      reason: ${{ steps.karar.outputs.reason }}
    steps:
      - name: Veriyi çek (yalnızca scripts/ + data/)
        uses: actions/checkout@v6
        with:
          # Gecikmeli/sıradaki koşu da dalın GÜNCEL ucuna baksın
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            scripts
            data

      - name: Çekim gerekli mi?
        id: karar
        env:
          FORCE_INPUT: ${{ inputs.force }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Runner adımı `bash -e` ile çalıştırıyor; çıkış kodlarını biz yönetiyoruz.
          set +e
          FORCE=false
          WHY=""
          if [ "$FORCE_INPUT" = "true" ]; then
            FORCE=true; WHY="elle tetikleme (force)"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            # main'e kazıyıcı/workflow değişikliği geldi: yeni kod hemen devreye girsin
            FORCE=true; WHY="main'e kod değişikliği merge edildi (push)"
          fi
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            NEEDED=true
            REASON="zorla çekim — $WHY"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          else
            OUT=$(python3 scripts/freshness.py --data data/daily.json --github-output 2>&1)
            rc=$?
            echo "$OUT"
            NEEDED=$(printf '%s\n' "$OUT" | sed -n 's/^needed=//p' | tail -n 1)
            REASON=$(printf '%s\n' "$OUT" | sed -n 's/^reason=//p' | tail -n 1)
            if [ "$rc" -ne 0 ] || [ -z "$NEEDED" ]; then
              # Karar verilemedi: güvenli taraf — çek (son yazılan değer geçerlidir)
              NEEDED=true
              REASON="karar betiği hata verdi (rc=$rc) — güvenli taraf: çekim yapılacak"
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [ "$NEEDED" = "true" ]; then
            echo "::notice::Çekim başlıyor: $REASON"
          else
            echo "Çekim gerekmiyor: $REASON"
          fi
          {
            echo "### Tazelik kontrolü"
            echo ""
            if [ "$NEEDED" = "true" ]; then echo "- **Karar:** çekim yapılacak"; else echo "- **Karar:** çekim gerekmiyor (veri taze)"; fi
            echo "- **Gerekçe:** $REASON"
            echo "- **Tetikleyici:** $GITHUB_EVENT_NAME · dal: $GITHUB_REF_NAME"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  fetch-columns:
    name: Köşe yazılarını çek ve commit'le
    needs: kontrol
    if: needs.kontrol.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Aynı anda iki çekim main'e yazmaya çalışmasın: sıraya girerler. Kilit İŞ
    # düzeyinde — yarım saatlik hafif kontroller kilide takılmadan koşar.
    concurrency:
      group: kose-fetch-columns
      cancel-in-progress: false
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v6
        with:
          # Kilitte beklerken başka bir koşu main'e yazmış olabilir: tetiklendiği
          # andaki commit'i değil dalın güncel ucunu al (betik tazeliği yeniden
          # denetler; veri bu arada tazelendiyse çekim atlanır).
          ref: ${{ github.ref_name }}
          # push reddedilince uzak ucun üzerine yeniden yazabilmek için tam geçmiş
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4

      - name: Köşe yazılarını çek
        env:
          FORCE: ${{ needs.kontrol.outputs.force }}
        run: |
          # Runner adımı `bash -e` ile çalıştırıyor; betiğin çıkış kodunu kendimiz
          # yönettiğimiz için -e kapatılır (yoksa ilk başarısız çekimde döngü kesilir).
          set +e
          set -uo pipefail
          # Zorla çekimde (elle force / main'e push) tazelik kısayolu devre dışı.
          # Aksi halde betik aynı politikayla (scripts/freshness.py) tazeliği
          # yeniden denetler: kilitte beklerken veri tazelendiyse çekim atlanır.
          EXTRA=""
          if [ "${FORCE:-false}" = "true" ]; then
            EXTRA="--min-interval-hours 0"
          fi

          # Betik 2 dönerse bugünün verisi üretilememiştir (ağ hatası / dizinler
          # değişmiş / henüz çok erken). Bir kez daha deniyoruz: günlük güncelleme
          # tek bir başarısız koşuda kaybolmasın.
          for attempt in 1 2; do
            echo "=== Çekim denemesi $attempt ==="
            # shellcheck disable=SC2086
            python scripts/fetch_columns.py $EXTRA --require-articles 20
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Çekim tamam (deneme $attempt)."
              exit 0
            fi
            echo "::warning::Bugünün verisi üretilemedi (çıkış $rc, deneme $attempt)"
            [ "$attempt" -lt 2 ] && sleep 30
          done
          echo "::error::İki denemede de bugünün köşe yazıları üretilemedi — mevcut data/daily.json korundu, sıradaki yoklama (≤30 dk) yeniden deneyecek."
          exit 1

      - name: Sonuçları commit'le
        if: ${{ !cancelled() }}
        run: |
          # -e kapalı: push reddi/fetch hatası bizim yönettiğimiz deneme döngüsünü
          # yarıda kesmemeli; adımın sonucunu açıkça biz belirliyoruz.
          set +e
          set -uo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          git config user.name "kose-bot"
          git config user.email "kose-bot@users.noreply.github.com"
          git add data/daily.json data/writers.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok (veri zaten tazeydi ya da çekim boş döndü) — commit atlanıyor."
            exit 0
          fi
          git commit -m "chore: günlük köşe yazıları güncellendi ($(date -u '+%Y-%m-%d %H:%M') UTC)"

          # Ürettiğimiz dosyaları kenara al: push reddedilirse uzak ucun üzerine
          # bunları yeniden yazıp tek commit'le tekrar deniyoruz. data/*.json
          # üretilen bir artefakt olduğu için rebase/merge çatışması hiç yaşanmaz.
          GEN="$(mktemp -d)"
          cp data/daily.json data/writers.json "$GEN"/

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              echo "Push tamam (deneme $attempt)."
              exit 0
            fi
            echo "::warning::push reddedildi (deneme $attempt) — uzak senkronize edilip yeniden denenecek"
            sleep $((attempt * 10))
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true

            # Uzaktaki veri bizimkinden tazeyse (eşzamanlı başka bir koşu yazdıysa)
            # kendi çıktımızı bırakıyoruz: amaç "main'de bugünün verisi olsun".
            REMOTE_NEWER=$(GEN="$GEN" BRANCH="$BRANCH" python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime

          def stamp(text):
              try:
                  return json.loads(text).get("fetchedAt") or ""
              except Exception:
                  return ""

          def parse(value):
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except Exception:
                  return None

          branch = os.environ.get("BRANCH", "main")
          try:
              proc = subprocess.run(
                  ["git", "show", f"origin/{branch}:data/daily.json"],
                  capture_output=True, text=True, check=True,
              )
              remote = parse(stamp(proc.stdout))
          except Exception:
              remote = None
          try:
              with open(os.path.join(os.environ["GEN"], "daily.json"), encoding="utf-8") as f:
                  local = parse(stamp(f.read()))
          except Exception:
              local = None
          print("yes" if (remote and local and remote > local) else "no")
          PY
            ) || echo "no"
            if [ "$REMOTE_NEWER" = "yes" ]; then
              echo "Uzakta daha taze veri var (başka bir koşu yazmış) — bu koşunun çıktısı bırakılıyor, sorun değil."
              exit 0
            fi

            # Uzak uca sıfırla, taze çıktımızı yeniden yaz, tek commit'le tekrar dene.
            git reset --hard "origin/$BRANCH"
            cp "$GEN"/daily.json "$GEN"/writers.json data/
            git add data/daily.json data/writers.json
            if git diff --cached --quiet; then
              echo "Uzakla içerik aynılaştı — commit gerekmiyor."
              exit 0
            fi
            git commit -m "chore: günlük köşe yazıları güncellendi ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          done
          echo "::error::push 5 denemede de başarısız"
          exit 1

      - name: İş özeti
        if: ${{ !cancelled() }}
        run: |
          { python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone

          TR = timezone(timedelta(hours=3))
          today = datetime.now(TR).strftime("%Y-%m-%d")
          try:
              with open("data/daily.json", encoding="utf-8") as f:
                  d = json.load(f)
          except Exception as exc:
              print(f"### Günlük veri okunamadı\n\n`{exc}`")
              raise SystemExit

          arts = d.get("articles") or []
          fetched = d.get("fetchedAt") or ""
          age = "?"
          try:
              dt = datetime.fromisoformat(fetched.replace("Z", "+00:00"))
              age = f"{(datetime.now(timezone.utc) - dt).total_seconds() / 3600:.1f} saat"
          except Exception:
              pass

          print("### Köşe yazısı güncelleme özeti\n")
          print(f"- **Veri günü (TSİ):** {d.get('date')}")
          print(f"- **Çekim:** {fetched} ({age} önce)")
          print(f"- **Makale:** {len(arts)} · **gazete:** {d.get('papers')} · **yazar dizini:** {d.get('writers')}")
          if d.get("date") != today:
              print(f"- ⚠️ Veri bugüne ({today}) ait değil — sıradaki yoklama (≤30 dk) yeniden deneyecek.")
          else:
              print("- ✅ Dalda bugünün verisi var.")
          PY
          } >> "$GITHUB_STEP_SUMMARY" || echo "::warning::iş özeti üretilemedi"
