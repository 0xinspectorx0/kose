name: Köşe Yazılarını Güncelle (Günlük)

# GEÇİCİ: fotoğraf/yazar teşhisi çalıştırır ve data/diag.json'ı commit'ler.
on:
  push:
    branches:
      - 'arena/d1241d9e-kose'

permissions:
  contents: write

jobs:
  fetch-columns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4

      - name: Teşhis çalıştır
        run: python scripts/diag_photos.py

      - name: Teşhis sonucunu commit'le
        run: |
          git config user.name "kose-bot"
          git config user.email "kose-bot@users.noreply.github.com"
          git add data/diag.json
          git commit -m "chore: fotoğraf teşhis çıktısı" && git push
