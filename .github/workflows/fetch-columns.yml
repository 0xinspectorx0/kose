name: Köşe Yazılarını Güncelle (Günlük)

# GEÇİCİ SÜRÜM: yazar fotoğrafı çıkarımını küçük bir örnekle doğrulamak için
# push ile tetiklenir ve sonuçları data/*.test.json olarak artefakta koyar.
# Doğrulama bitince main'deki özgün hâline geri döndürülecek.

on:
  push:
    branches:
      - 'arena/d1241d9e-kose'

permissions:
  contents: write

jobs:
  fetch-columns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4

      - name: Küçük örnek çek (fotoğraf doğrulaması)
        run: |
          python scripts/fetch_columns.py \
            --max-per-paper 3 --max-per-source 1 \
            --out data/daily.test.json --writers-out data/writers.test.json

      - name: Test verilerini artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kose-photo-test
          path: data/
          if-no-files-found: warn
