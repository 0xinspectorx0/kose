name: Köşe Yazılarını Güncelle (Günlük)

# Günde üç kez (04:00 / 08:30 / 14:00 UTC) Türk gazetelerinin köşe yazar
# sayfalarından yazıları çeker ve data/daily.json + data/writers.json olarak
# main'e commit'ler. Uygulama bu iki dosyayı önce main'den canlı okur.
# Not: `schedule` tetikleyicisi GitHub'da yalnızca varsayılan dalda (main)
# çalışır; bu dosya main'e merge edildiğinde otomatik zamanlama başlar.
# Herhangi bir dalda elle çalıştırmak için: Actions -> workflow -> Run workflow

on:
  schedule:
    - cron: '0 4 * * *'   # ana koşu: her gün 04:00 UTC = 07:00 TSİ
    - cron: '30 8 * * *'  # yedek 1: GitHub yoğunlukta schedule'ları atlayabilir; çok giriş dayanıklılık sağlar
    - cron: '0 14 * * *'  # yedek 2: öğleden sonra yayılan köşeleri de yakalar (değişiklik yoksa commit zaten atlanır)
  workflow_dispatch: # elle tetikleme: Actions → Run workflow (main üzerinde çalıştır)

permissions:
  contents: write

jobs:
  fetch-columns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4

      - name: Köşe yazılarını çek
        run: python scripts/fetch_columns.py

      - name: Sonuçları doğrula
        run: |
          echo "== data kontrolü =="
          ls -lh data/ || echo "data klasörü yok"
          if [ -f data/writers.json ]; then
            echo "writers.json:"
            python -c 'import json; d=json.load(open("data/writers.json")); print("  total=%s papers=%s" % (d.get("total"), len(d.get("papers",[]))))' || cat data/writers.json | head -n 30
            # boş keşif (total 0) ise ve git geçmişinde dolu veri varsa, stage'i geri al — sahte boş commit önlenir
            total=$(python -c "import json; print(json.load(open('data/writers.json')).get('total',0))" 2>/dev/null || echo 1)
            if [ "$total" = "0" ] && git ls-files --error-unmatch data/writers.json >/dev/null 2>&1; then
              prev=$(git show HEAD:data/writers.json 2>/dev/null | python -c "import json,sys; print(json.load(sys.stdin).get('total',0))" 2>/dev/null || echo 0)
              if [ "$prev" != "0" ] && [ "$prev" != "" ]; then
                echo "UYARI: keşif 0 yazar döndürdü ama önceki kayıt $prev yazar — boş dosya commit edilmeyecek."
                git checkout -- data/writers.json 2>/dev/null || rm -f data/writers.json
              fi
            fi
          fi
          if [ -f data/daily.json ]; then
            echo "daily.json:"
            python -c 'import json; d=json.load(open("data/daily.json")); print("  count=%s papers=%s writers=%s" % (d.get("count"), d.get("papers"), d.get("writers")))' || cat data/daily.json | head -n 50
          fi

      - name: Sonuçları commit'le
        run: |
          git config user.name "kose-bot"
          git config user.email "kose-bot@users.noreply.github.com"
          git add data/daily.json data/writers.json || true
          # boş writers.json stage edildiyse geri al (ağ hatası koruması)
          if [ -f data/writers.json ]; then
            staged_total=$(git show :data/writers.json 2>/dev/null | python -c "import json,sys; print(json.load(sys.stdin).get('total',-1))" 2>/dev/null || echo -1)
            if [ "$staged_total" = "0" ]; then
              prev=$(git show HEAD:data/writers.json 2>/dev/null | python -c "import json,sys; print(json.load(sys.stdin).get('total',0))" 2>/dev/null || echo 0)
              if [ "$prev" != "0" ] && [ "$prev" != "" ]; then
                echo "Boş writers.json stage edilmiş — geri alınıyor."
                git restore --staged data/writers.json 2>/dev/null || git reset HEAD -- data/writers.json 2>/dev/null || true
                git checkout -- data/writers.json 2>/dev/null || rm -f data/writers.json
              fi
            fi
          fi
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore: günlük köşe yazıları güncellendi ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            # Çakışma toleransı: elle tetiklenen + gecikmiş schedule koşusu aynı anda
            # push ederse ikincisi reddedilir. Uzaktaki içerik bizimle aynıysa bu
            # başarıdır; değilse rebase edip bir kez daha dene.
            if ! git push; then
              git fetch origin "${GITHUB_REF_NAME:-main}"
              if git diff --quiet "origin/${GITHUB_REF_NAME:-main}" -- data/daily.json data/writers.json; then
                echo "Uzakta aynı içerik var (eşzamanlı koşu yazdı); sorun değil."
              else
                git rebase "origin/${GITHUB_REF_NAME:-main}" || git rebase --abort
                git push || { echo "::error::push başarısız"; exit 1; }
              fi
            fi
          fi
