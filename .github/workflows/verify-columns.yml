name: Günlük Veri Denetimi (Watchdog)

# "Köşe yazıları her gün gerçekten güncelleniyor mu?" sorusunun otomatik cevabı.
#
# fetch-columns.yml veriyi ÜRETİR; bu workflow üretilen veriyi DENETLER:
#   1. data/daily.json bugünün verisi mi? (TSİ gün damgası)
#   2. Son çekim ne kadar önce? Kaç yazı, kaç kaynak var?
#   3. En son yayımlanan yazılar çekilmiş mi? (son 24 saatte yayımlanan yazı
#      sayısı + kaynak bazında "günün yazısı" dağılımı)
#   4. Akışa eski yazı sızmış mı? (en eski yazının yaşı)
#   5. Yazar dizini (writers.json) sağlam ve taze mi?
#
# Denetim başarısızsa: çekim workflow'u force=true ile tetiklenir (kendi kendini
# onarma), bitmesi beklenir, veri yeniden denetlenir. Yine başarısızsa koşu
# KIRMIZI biter — Actions sekmesinde/bildirimlerde görünür.
#
# Zamanlama: fetch-columns yarım saatte bir yoklar; denetim günde 2 kez, sabah
# yayın penceresi (05-12 TSİ) kapandıktan sonra ve akşam gelir.
# GitHub zamanlanmış koşuları bu depoda 3-6 saat geciktirdiği için denetim
# gece yarısından sonraya kayabiliyor; 00:00-09:00 TSİ arasına düşen
# ZAMANLANMIŞ koşu atlanır (günün köşeleri henüz yayımlanmamışken "6 kaynak
# günün yazısını getirmiş mi?" maddesi yanlış alarm verirdi). Elle tetikleme
# her saatte denetler.

on:
  schedule:
    - cron: '7 8 * * *'    # 11:07 TSİ — sabah yayın penceresi kapandıktan sonra
    - cron: '7 15 * * *'   # 18:07 TSİ — akşam denetimi (gecikse de çoğunlukla gece yarısından önce)
  push:   # GEÇİCİ: dal üzerinde uçtan uca doğrulama (onarma dispatch'i inputs[force] ile)
    branches: [arena/3d2f061e-kose]
    paths: ['.github/workflows/verify-columns.yml']
  workflow_dispatch:
    inputs:
      heal:
        description: 'Veri bayatsa çekimi zorla tetikle (kendi kendini onarma)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # bayat veride fetch-columns.yml'i tetikleyebilmek için

concurrency:
  group: kose-verify-columns
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Saat kontrolü (gece saatine kaymış zamanlanmış koşu)
        id: saat
        run: |
          H=$(date -u -d '+3 hours' +%H)   # TSİ saat (UTC+3, yaz saati yok)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$((10#$H))" -lt 9 ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::Zamanlanmış denetim GitHub gecikmesiyle TSİ $H:xx'e kaydı — günün köşeleri henüz yayımlanmadığı için bu koşu atlandı (yanlış alarm olmasın). Elle tetikleme her saatte denetler."
            {
              echo "### Günlük veri denetimi atlandı"
              echo ""
              echo "Zamanlanmış koşu GitHub gecikmesiyle **TSİ $H:xx**'e kaydı; 00:00-09:00 arası günün köşeleri henüz yayımlanmadığından denetim yapılmadı."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Depoyu çek
        if: steps.saat.outputs.skip != 'yes'
        uses: actions/checkout@v6

      - name: Python kur
        if: steps.saat.outputs.skip != 'yes'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Veriyi denetle
        id: check
        if: steps.saat.outputs.skip != 'yes'
        run: |
          # Runner adımı `bash -e` ile çalıştırıyor; çıkış kodunu biz yönetiyoruz.
          set +e
          # Boru (| tee) kullanılmıyor: runner'ın varsayılan kabuğunda pipefail yok,
          # bu yüzden rc=$? tee'nin kodunu okur ve denetim hep "sağlıklı" görünürdü.
          python3 scripts/verify_daily.py > "$RUNNER_TEMP/rapor.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/rapor.txt"
          echo "#### İlk denetim" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/verify_daily.py --markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          if [ "$rc" -eq 0 ]; then
            echo "healthy=yes" >> "$GITHUB_OUTPUT"
            echo "Denetim sağlıklı."
          else
            echo "healthy=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Bugünün köşe yazıları main'de eksik/bayat — onarma denenecek."
          fi
          exit 0

      - name: Bayatsa çekimi zorla tetikle (kendi kendini onarma)
        id: heal
        # Zamanlanmış koşullarda `inputs` boş olur; bu yüzden "dispatch değilse
        # ya da heal işaretliyse" biçiminde açık yazıldı (null != false tuzağı).
        if: steps.saat.outputs.skip != 'yes' && steps.check.outputs.healthy == 'no' && (github.event_name != 'workflow_dispatch' || inputs.heal)
        run: |
          # Runner adımı `bash -e` ile çalıştırıyor; çıkış kodlarını biz yönetiyoruz.
          set +e
          BRANCH="${GITHUB_REF_NAME:-main}"
          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "::notice::Onarma başlıyor — fetch-columns.yml (ref=$BRANCH, force=true), eşik $START"
          DISPATCH_URL="repos/$GITHUB_REPOSITORY/actions/workflows/fetch-columns.yml/dispatches"
          # Girdiler `inputs` nesnesinin İÇİNDE gönderilmeli: {"ref":…,"inputs":{"force":"true"}}.
          # (Önceki sürüm `-F force=true` ile en üst düzeye yazıyordu; GitHub bunu
          # '"force" is not a permitted key' (422) diye reddediyordu.)
          DISPATCH_OUT=$(gh api -X POST "$DISPATCH_URL" -f ref="$BRANCH" -f "inputs[force]=true" 2>&1)
          DISPATCH_RC=$?
          echo "dispatch (inputs.force=true) rc=$DISPATCH_RC çıktı=${DISPATCH_OUT:0:300}"
          if [ "$DISPATCH_RC" -ne 0 ]; then
            # Yedek: girdisiz dispatch her zaman geçerlidir; bayat veride tazelik
            # politikası (scripts/freshness.py) çekimi zaten başlatır.
            echo "::warning::force girdisi kabul edilmedi (rc=$DISPATCH_RC) — girdisiz dispatch deneniyor"
            DISPATCH_OUT=$(gh api -X POST "$DISPATCH_URL" -f ref="$BRANCH" 2>&1)
            DISPATCH_RC=$?
            echo "dispatch (girdisiz) rc=$DISPATCH_RC çıktı=${DISPATCH_OUT:0:300}"
          fi
          if [ "$DISPATCH_RC" -ne 0 ]; then
            echo "::error::Çekim workflow'u tetiklenemedi (rc=$DISPATCH_RC): ${DISPATCH_OUT:0:300}"
            echo "healed=no" >> "$GITHUB_OUTPUT"
            echo "reason=dispatch-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::Dispatch kabul edildi — koşunun kaydı bekleniyor"

          # Koşunun kaydının oluşmasını bekle (dispatch asenkron). Yarım saatlik
          # zamanlanmış yoklamalar da aynı workflow'da koştuğu için yalnızca BİZİM
          # tetiklediğimiz (workflow_dispatch, START'tan sonra, aynı dal) koşu seçilir.
          RUN_ID=""
          for i in $(seq 1 24); do
            sleep 10
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fetch-columns.yml/runs?event=workflow_dispatch&per_page=10" \
              -q "[.workflow_runs[] | select(.created_at >= \"$START\" and .event == \"workflow_dispatch\" and .head_branch == \"$BRANCH\")] | sort_by(.created_at) | .[0].id // empty")
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::warning::Tetiklenen koşu listeye düşmedi (dispatch 204 döndü ama koşu yok). GITHUB_TOKEN ile tetiklenen etkinlikler yeni koşu başlatmıyor olabilir — Actions'tan elle 'Run workflow' (force) gerekir."
            echo "healed=no" >> "$GITHUB_OUTPUT"
            echo "reason=no-run-created" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::Onarma koşusu: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"

          # Bitmesini bekle (en çok ~22 dk; çekim genelde 7-8 dk sürer, kilitte
          # sıradaki bir çekim varsa biraz daha)
          STATUS="queued"
          for i in $(seq 1 45); do
            STATUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -q '.status')
            if [ "$STATUS" = "completed" ]; then break; fi
            sleep 30
          done
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" -q '.conclusion // "bilinmiyor"')
          echo "::notice::Onarma koşusu bitti: $CONCLUSION (durum=$STATUS)"

          # main'in güncel verisini indir ve yeniden denetle
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout "origin/$BRANCH" -- data/daily.json data/writers.json 2>/dev/null
          echo "healed=$([ "$CONCLUSION" = "success" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "run=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Son denetim
        if: ${{ !cancelled() && steps.saat.outputs.skip != 'yes' }}
        run: |
          set +e
          if [ "${{ steps.heal.outputs.run }}" != "" ]; then
            {
              echo ""
              echo "#### Onarma koşusu"
              echo ""
              echo "- Tetiklenen koşu: [\`${{ steps.heal.outputs.run }}\`](https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ steps.heal.outputs.run }}) → **${{ steps.heal.outputs.conclusion }}**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "#### Onarma sonrası denetim" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/verify_daily.py > "$RUNNER_TEMP/son.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/son.txt"
          python3 scripts/verify_daily.py --markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          if [ "$rc" -eq 0 ]; then
            echo "✅ Günlük veri denetimi sağlıklı: bugünün en son köşe yazıları main'de."
            exit 0
          fi
          echo "::error::Günlük veri denetimi BAŞARISIZ — bugünün köşe yazıları main'de yok ya da eksik. Ayrıntı iş özetinde; elle tetiklemek için: Actions → Köşe Yazılarını Güncelle (Günlük) → Run workflow (force)."
          exit 1
